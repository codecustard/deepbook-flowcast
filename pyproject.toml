[project]
name = "deepbook-flowcast"
version = "0.1.0"
description = "When does ML beat the imbalance rule? Order-flow prediction on DeepBook, Sui's on-chain order book"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Emmanuel Barroga", email = "emmanuelbarroga@gmail.com" }]
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "typer>=0.12",
    "tqdm>=4.66",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.5", "lightgbm>=4.3"]  # SHAP values: lightgbm predict(pred_contrib=True)
dl = ["torch>=2.3"]
serve = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "streamlit>=1.36"]
dev = ["pytest>=8", "ruff>=0.5", "ipykernel", "matplotlib"]

[project.scripts]
flowcast = "flowcast.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowcast"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
